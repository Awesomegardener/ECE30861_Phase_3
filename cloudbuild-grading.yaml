# Build only. Explicit instrumented grading target; no Cloud Run deployment.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - cra-service/Dockerfile
      - --target
      - grading
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/cra-api-grading:$COMMIT_SHA
      - --build-arg
      - BUILD_SHA=$COMMIT_SHA
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/cra-api-grading:$COMMIT_SHA
substitutions:
  _REGION: us-central1
  _REPOSITORY: cra-phase3
options:
  logging: CLOUD_LOGGING_ONLY
