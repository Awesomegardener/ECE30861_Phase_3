[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["cra-service/main.py", "cra-service/sbom_validation.py"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["cra-service"]
