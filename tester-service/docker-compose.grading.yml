# Cloud-compatible request-driven coverage. No bind mount or Docker-exec import.
services:
  api:
    build:
      target: grading
    cpus: 1.0
    mem_limit: 1g
    environment:
      AUTOGRADER_COVERAGE_ENABLED: "true"
      AUTOGRADER_COVERAGE_TARGETS: http://127.0.0.1:8080
      AUTOGRADER_COVERAGE_TOKEN: local-grading-coverage-key-for-tests-only
  tester:
    cpus: 1.0
    mem_limit: 1g
    environment:
      AUTOGRADER_COVERAGE_ENABLED: "true"
      AUTOGRADER_COVERAGE_TARGETS: http://api:8080
      AUTOGRADER_COVERAGE_TOKEN: local-grading-coverage-key-for-tests-only
