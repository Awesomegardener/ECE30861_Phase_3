name: CRA Phase 3 and 4 checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  phase3:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cra-phase3-deployment-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cra-service/requirements*.txt
      - run: python -m pip install -r cra-service/requirements-dev.txt
      - name: Static checks and authoritative input validation
        run: |
          python -m ruff check cra-service tester-service scripts
          python -m ruff format --check cra-service tester-service scripts
          python -m mypy
          python scripts/check_contract.py
      - name: Start isolated PostgreSQL/API stack
        run: docker compose -f cra-service/docker-compose.test.yml up --build -d --wait --wait-timeout 240
      - name: Acceptance and startup tests
        run: |
          set -euo pipefail
          python -m pytest cra-service --allow-reset --base-url http://127.0.0.1:18080 --capture-http-bodies --tested-commit "$GITHUB_SHA" --junitxml=artifacts/results.xml
          docker compose -f cra-service/docker-compose.test.yml exec -T -e CRA_RACE_TEST_ALLOW_RESET=1 api python - < scripts/check_release_reset_race.py | tee artifacts/release-reset-race.log
          docker compose -f cra-service/docker-compose.test.yml exec -T api python - < scripts/check_startup_schema.py | tee artifacts/schema-startup.json
          python scripts/check_deployment_runtime.py --project "$COMPOSE_PROJECT_NAME" --evidence-dir artifacts
          docker compose -f cra-service/docker-compose.test.yml exec -T api python - < scripts/check_local_rollback.py
          python scripts/check_contract.py
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f cra-service/docker-compose.test.yml logs --no-color > artifacts/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-results
          path: artifacts/
      - name: Stop isolated stack
        if: always()
        run: docker compose -f cra-service/docker-compose.test.yml down

  autograder:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cra-phase3-autograder-ci
      HARNESS_INTEGRATION: "1"
      HARNESS_SYSTEM_URL: http://127.0.0.1:18086
      HARNESS_TESTER_URL: http://127.0.0.1:18087
      HARNESS_EVIDENCE_DIR: artifacts/autograder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cra-service/requirements*.txt
      - run: python -m pip install -r cra-service/requirements-dev.txt
      - name: Prose-contract regressions and both role specifications
        run: |
          python -m pytest tester-service/tests --ignore=tester-service/tests/test_http.py --ignore=tester-service/tests/test_grading_http.py -q
          python scripts/update_suite_plan.py --check
          python -c "import yaml; from openapi_spec_validator import validate_spec; [validate_spec(yaml.safe_load(open(p))) for p in ['docs/autograder-openapi.yaml','docs/system-test-openapi.yaml']]"
      - name: Start disposable uninstrumented system and tester
        run: docker compose -f tester-service/docker-compose.test.yml up --build -d --wait --wait-timeout 240
      - name: Ordinary HTTP, Phase 4, database safety and report persistence
        run: |
          python -m pytest tester-service/tests/test_http.py -q --junitxml=artifacts/autograder/http-results.xml
          python scripts/check_phase4_runtime.py --project "$COMPOSE_PROJECT_NAME" --evidence-dir artifacts/autograder
          python scripts/check_osv_runtime.py --project "$COMPOSE_PROJECT_NAME" --evidence-dir artifacts/autograder
          python scripts/check_autograder_runtime.py --project "$COMPOSE_PROJECT_NAME"
      - name: Verify exact grader request and genuine server coverage without public access
        env:
          HARNESS_SYSTEM_PORT: "18316"
          HARNESS_TESTER_PORT: "18317"
          HARNESS_TIMEOUT_PORT: "18318"
          HARNESS_SYSTEM_URL: http://127.0.0.1:18316
          HARNESS_TESTER_URL: http://127.0.0.1:18317
          HARNESS_TIMEOUT_URL: http://127.0.0.1:18318
          HARNESS_UNAVAILABLE_SYSTEM_URL: http://127.0.0.1:18319
          HARNESS_CONTRACT_INTEGRATION: "1"
          HARNESS_GRADING_INTEGRATION: "1"
          HARNESS_EVIDENCE_DIR: artifacts/contract-live
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract-live/tls artifacts/contract-live/control
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=Isolated contract test only' -addext 'subjectAltName=DNS:cra-phase3-api-456725640364.us-central1.run.app' -keyout artifacts/contract-live/tls/server.key -out artifacts/contract-live/tls/ca.crt 2> artifacts/contract-live/tls-generation.log
          export HARNESS_TLS_DIR="$PWD/artifacts/contract-live/tls"
          export HARNESS_CONTROL_DIR="$PWD/artifacts/contract-live/control"
          docker compose -p cra-phase3-autograder-contract-ci -f tester-service/docker-compose.test.yml -f tester-service/docker-compose.contract.yml up --build -d --wait --wait-timeout 240 db api tls-target tester timeout-tester contract-access unavailable-system
          docker network inspect cra-phase3-autograder-contract-ci_default --format '{{.Internal}}' | grep -x true
          python -m pytest tester-service/tests/test_http.py tester-service/tests/test_grading_http.py -q --junitxml=artifacts/contract-live/results.xml
      - name: Capture adapter logs
        if: always()
        run: |
          mkdir -p artifacts/autograder artifacts/contract-live
          docker compose -f tester-service/docker-compose.test.yml logs --no-color > artifacts/autograder/compose.log
          docker compose -p cra-phase3-autograder-contract-ci -f tester-service/docker-compose.test.yml logs --no-color > artifacts/contract-live/compose.log 2>&1 || true
          rm -f artifacts/contract-live/tls/server.key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autograder-results
          path: |
            artifacts/autograder/
            artifacts/contract-live/
      - name: Stop disposable services without deleting volumes
        if: always()
        run: |
          docker compose -f tester-service/docker-compose.test.yml down
          docker compose -p cra-phase3-autograder-contract-ci -f tester-service/docker-compose.test.yml down
