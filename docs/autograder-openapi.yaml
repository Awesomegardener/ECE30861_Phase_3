openapi: 3.1.1
info:
  title: Team 2 tester cross-team interface
  version: 0.4.2
  description: Implements the full Cross-team Testing Interface prose, not the earlier
    provisional peer adapter. All errors use message/source. Tester results contain
    every planned ID once; errors require source. Counts are both null when unavailable;
    otherwise 0 <= covered <= total. Component coverage is unavailable without pod
    definitions. System coverage uses AC-01 through AC-10. See autograder-interface.md
    for lifecycle, timing, cleanup and limitations.
paths:
  /test/setup:
    post:
      summary: Forward preparation and return only after the system is ready
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossTeamSetupRequest'
      responses:
        '201':
          description: Prepared session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamSetupResponse'
        '400': &id001
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamError'
        '404': &id002
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamError'
        '409': &id003
          description: Conflict or report not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamError'
        '500': &id004
          description: Service failure or tester abort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamError'
        default:
          description: System setup failure forwarded with its original status, message
            and source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamError'
  /test/report:
    get:
      summary: Read a stored completed suite without changing it
      parameters:
      - name: session_id
        in: query
        required: true
        schema: &id005
          type: string
          minLength: 1
      responses:
        '200':
          description: Suite report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamReport'
        '400': *id001
        '404': *id002
        '409': *id003
        '500': *id004
  /test/run:
    post:
      summary: Execute one planned suite once; store and return its complete report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id: *id005
              additionalProperties: false
      responses:
        '200':
          description: Complete suite including target failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamReport'
        '400': *id001
        '404': *id002
        '409': *id003
        '500': *id004
components:
  schemas:
    CrossTeamSessionId: *id005
    CrossTeamError:
      type: object
      required:
      - message
      - source
      properties:
        message:
          type: string
          minLength: 1
        source: &id006
          enum:
          - tester
          - system
          - communication
          - unknown
      additionalProperties: false
    CrossTeamMeasure:
      type: object
      required:
      - covered
      - total
      - basis
      properties:
        covered:
          type:
          - integer
          - 'null'
          minimum: 0
        total:
          type:
          - integer
          - 'null'
          minimum: 0
        basis:
          type: string
          minLength: 1
      allOf:
      - if:
          properties:
            covered:
              type: 'null'
        then:
          properties:
            total:
              type: 'null'
        else:
          properties:
            total:
              type: integer
    CrossTeamResult:
      type: object
      required:
      - test_id
      - outcome
      - message
      properties:
        test_id: *id005
        outcome:
          enum:
          - pass
          - fail
          - error
          - skip
        message:
          type: string
          minLength: 1
        source: *id006
      allOf:
      - if:
          properties:
            outcome:
              const: error
        then:
          required:
          - source
    CrossTeamSetupResponse:
      type: object
      required:
      - session_id
      properties:
        session_id: *id005
      additionalProperties: false
    CrossTeamReport:
      type: object
      required:
      - session_id
      - coverage
      - target_url
      - results
      properties:
        session_id: *id005
        coverage:
          type: object
          required:
          - code
          - component
          - system
          properties:
            code:
              $ref: '#/components/schemas/CrossTeamMeasure'
            component:
              $ref: '#/components/schemas/CrossTeamMeasure'
            system:
              $ref: '#/components/schemas/CrossTeamMeasure'
        target_url:
          type: string
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/CrossTeamResult'
    CrossTeamSetupRequest:
      type: object
      required:
      - target_url
      properties:
        target_url:
          type: string
          format: uri
        setup:
          type: object
      additionalProperties: false
